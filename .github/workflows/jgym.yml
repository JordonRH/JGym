name: JGym CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: jgym-production
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test -- src/lib/jgym.test.js src/lib/import-csv.test.js src/lib/import-bodyweight.test.js src/lib/import-reimport.test.js src/views/Admin.test.jsx src/views/Admin.password.test.jsx
        working-directory: frontend
      - run: npm ci --omit=optional --ignore-scripts
        working-directory: api
      - run: node --test test/server-first-user-admin.test.js test/server-password.test.js test/server-data-rev.test.js test/server-admin-state.test.js
        working-directory: api

  deploy:
    name: Deploy to Docker host
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH host verification
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Pull, rebuild, and restart JGym
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd \"$DEPLOY_PATH\" && \
             git pull --ff-only origin main && \
             docker compose -f compose.jgym.yml --profile tunnel pull cloudflared && \
             docker compose -f compose.jgym.yml --profile tunnel up -d --build --remove-orphans && \
             docker compose -f compose.jgym.yml --profile tunnel ps"
